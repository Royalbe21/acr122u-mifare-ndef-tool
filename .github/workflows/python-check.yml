name: Python Check

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile app
        run: python -m py_compile .\src\master_nfc_writer.py

      - name: Run tests
        run: python -m pytest
